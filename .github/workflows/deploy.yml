name: Test and deploy CMS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cms-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run test
      - name: Validate core and custom migrations
        run: |
          migration_state="$(mktemp -d)"
          bunx wrangler d1 migrations apply macon170-cms --local --persist-to "$migration_state" --config wrangler.jsonc
          bunx wrangler d1 migrations apply macon170-cms --local --persist-to "$migration_state" --config wrangler.custom-migrations.jsonc
          bunx wrangler d1 execute macon170-cms --local --persist-to "$migration_state" --config wrangler.jsonc \
            --command "SELECT 1 FROM calendar_events LIMIT 1"
      - name: Validate Worker bundle
        run: bun run deploy:dry

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply CMS D1 migrations
        run: bun run db:migrate
      - name: Deploy CMS Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify public roster API
        run: |
          curl --fail-with-body --silent --show-error \
            --header 'Origin: https://www.macon170.com' \
            --dump-header /tmp/cms-headers \
            https://cms.macon170.com/api/collections/leadership-roster/content > /tmp/cms-roster.json
          grep --ignore-case --quiet '^access-control-allow-origin: https://www.macon170.com' /tmp/cms-headers
          jq --exit-status 'has("data")' /tmp/cms-roster.json > /dev/null
      - name: Verify public calendar API and subscription
        run: bun run test:smoke:calendar
