minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: type-check
        name: TypeScript check
        entry: bun run type-check
        language: system
        pass_filenames: false
        files: "^(src|tests?)/|^(package\\.json|tsconfig\\.json)$"
      - id: test
        name: Vitest
        entry: bun run test
        language: system
        pass_filenames: false
        files: "^(src|tests?)/|^(package\\.json|tsconfig\\.json)$"
      - id: trivy
        name: Trivy vulnerability, misconfiguration, and secret scan
        entry: trivy fs --skip-dirs node_modules --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 93c7b51d860138c34a0613756c0151209b88d56f
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8
    hooks:
      - id: codespell
        # Wrangler's generated runtime declarations contain upstream spelling
        # errors; scan authored CMS files instead.
        exclude: '^src/worker-configuration\.d\.ts$'
